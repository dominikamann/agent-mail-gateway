# Agent Mail Gateway configuration.
# Values written as ${NAME} are read from environment variables (for example a .env file).
# Never put passwords or API keys directly into this file.

server:
  # HTTP port for the REST API (/v1), the MCP endpoint (/mcp), /health and /docs. Default: 8080
  port: 8080
  # One of fatal, error, warn, info, debug, trace. Default: info
  log_level: info
  # Directory for the small SQLite state file (watcher progress, webhook queue, events, audit log).
  # Mount a volume here. Default: /data
  data_dir: /data

mailboxes:
  # One entry per agent. Each agent gets exactly one mailbox and one API key.
  - # Short identifier: lowercase letters, digits, _ or -. Used in logs and webhook payloads.
    name: assistant
    # The mailbox's email address. Mail is sent with this From address.
    address: youragent@yourmailserver.eu
    # The key the agent sends as "Authorization: Bearer <key>". At least 32 characters, unique.
    api_key: ${AGENT_API_KEY}

    # Incoming mail server. security: tls (usually port 993), starttls (usually 143),
    # or none (plain text, only for local testing).
    imap: { host: mail.yourmailserver.eu, port: 993, security: tls }
    # Outgoing mail server. security: tls (usually port 465) or starttls (usually 587).
    smtp: { host: mail.yourmailserver.eu, port: 465, security: tls }
    # Login for both IMAP and SMTP.
    username: youragent@yourmailserver.eu
    password: ${AGENT_MAIL_PASSWORD}

    # Who the agent may receive mail from. Exact addresses or "*@domain" (that exact domain,
    # no subdomains). Case does not matter. Mail from anyone else is never shown to the agent.
    # Empty list: the agent sees no mail at all.
    allow_receive_from:
      - you@yourmailserver.eu
      - "*@yourcompany.eu"
    # Who the agent may send mail and calendar invites to. Same pattern rules.
    # If any recipient (to, cc, bcc, attendee) is not listed, the whole request is rejected.
    # Empty list: the agent cannot send.
    allow_send_to:
      - you@yourmailserver.eu

    # What happens to mail from senders that are not allowed:
    #   delete - moved to the Trash folder (deleted permanently if the server has no Trash)
    #   keep   - left in the inbox, but still invisible to the agent
    # Default: delete
    non_allowed_action: delete
    # Only accept mail whose sender passed SPF/DKIM/DMARC according to the
    # Authentication-Results header your mail server adds. Protects against forged senders.
    # Set to false if your server does not add that header. Default: true
    require_sender_auth: true
    # Allow the agent to move received mail to Trash. Default: false
    allow_delete: false
    # Maximum number of sent messages (including calendar invites) per rolling hour.
    # 0 means unlimited. Default: 30
    max_sends_per_hour: 30
    # Maximum total attachment size per outgoing message, in megabytes. Default: 15
    max_attachment_mb: 15
    # IANA time zone used for event times given without an offset. Default: UTC
    timezone: Europe/Berlin
    # Safety-net polling interval for new mail, in seconds (minimum 10). New mail is normally
    # detected instantly via IMAP IDLE. Default: 300
    poll_interval_seconds: 300
    # Optional folder names. Normally detected automatically (special-use flags, then "Sent"/"Trash").
    # folders:
    #   sent: Sent
    #   trash: Trash

    # Optional: called with a signed POST whenever an allowed message arrives.
    webhook:
      url: https://hermes.example.com/hooks/mail
      # Used to sign requests (HMAC-SHA256). At least 16 characters.
      secret: ${AGENT_WEBHOOK_SECRET}
