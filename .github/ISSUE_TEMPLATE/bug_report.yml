name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. **Remove passwords, API keys and real email
        addresses from everything you paste.** Security problems belong in a
        [private advisory](https://github.com/dominikamann/agent-mail-gateway/security/advisories/new), not here.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Agent calls `send_mail` with ...
        2. ...
  - type: input
    id: version
    attributes:
      label: Gateway version
      placeholder: v0.3.4
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - MCP (Streamable HTTP)
        - MCP (stdio bridge)
        - REST API
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Agent or MCP client
      placeholder: Claude Desktop, Hermes, n8n, own code, ...
  - type: input
    id: mailserver
    attributes:
      label: Mail server
      placeholder: Dovecot/Postfix, Microsoft 365, Gmail, mailbox.org, ...
  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: The affected part of your `config.yaml`, anonymized.
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: The relevant lines of `docker logs`, anonymized.
      render: text
