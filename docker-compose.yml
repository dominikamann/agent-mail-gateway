services:
  agent-mail-gateway:
    image: ghcr.io/dominikamann/agent-mail-gateway:latest
    # build: .   # use this instead of image to build from source
    restart: unless-stopped
    ports:
      # Reachable from this machine only. Agents on other hosts should go through a reverse
      # proxy with TLS; change to "8080:8080" only on a trusted private network.
      - "127.0.0.1:8080:8080"
    env_file: .env
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - gateway-data:/data

  # Optional virus scanner for attachments: uncomment, then set
  # attachments.clamav: { host: clamav, port: 3310 } in config.yaml.
  # Needs about 1-2 GB of RAM and loads its virus database for a few minutes after start.
  # clamav:
  #   image: clamav/clamav:stable
  #   restart: unless-stopped
  #   volumes:
  #     - clamav-db:/var/lib/clamav

volumes:
  gateway-data:
  # clamav-db:
